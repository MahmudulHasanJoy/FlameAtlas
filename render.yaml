# Render Blueprint: one web service that serves the dashboard and the API.
# In Render: New > Blueprint > pick this repo. Set FLAMEATLAS_API_KEY when prompted.
services:
  - type: web
    name: flameatlas
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.0"
      - key: FLAMEATLAS_API_KEY
        sync: false
